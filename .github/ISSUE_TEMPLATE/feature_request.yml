name: Feature request
description: Something convex-workflow-patches should do that it doesn't.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The workflow change or upgrade, and where the package gets in the way or falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: An API, option or behavior, if you have one in mind.
