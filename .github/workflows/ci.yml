name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks before it publishes.
  workflow_call:
    inputs:
      ref:
        description: The ref to check out, when it isn't the one that triggered the run.
        type: string
        default: ''

# In a called run, github.workflow is the caller's name, so a release never
# cancels push CI or the other way around.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ready:
    name: Build, check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run ready

  e2e:
    name: End-to-end upgrades
    needs: ready
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run e2e
